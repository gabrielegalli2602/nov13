<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>Form Iscrizione</title>
	<link href="stileForm1.css" rel="stylesheet">

</head>

<body>

	<div id="cornice"><img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/7/70/Harvard_University_logo.svg/1280px-Harvard_University_logo.svg.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=thumbnail" alt="logo harvard" class="logo" /></div>

	<div id="container">
	
		<div id="menu">
			
			<ul>
				
				<li><a href="#">Home</a></li>
				<li><a href="#">Chi siamo</a></li>
				<li><a href="#">Corsi</a></li>
				
			</ul>
		
		</div>
	
		<form method="post" action="#" name="formCorso" id="formCorso" enctype="multipart/form-data">
		
			<fieldset id="datiA">
			
				<legend class="legenda">Dati anagrafici</legend>
				
				<p>Nome: <input type="text" name="nome" size="20" required/></p>
				<p>Cognome: <input type="text" name="cognome" size="20" required/></p>
				
				<p>Data di nascita: <input type="date" name="dataN" /></p>
				<p>Genere: <br />
				
					<input type="radio" name="genere" value="M" />Maschio<br/>
					<input type="radio" name="genere" value="F" />Femmina<br/>
					<input type="radio" name="genere" value="A" checked/>Altro
				
				</p>
				
				<p>Email: <input type="email" name="mail" placeholder="Scrivi qui la tua email" size="32" required/></p>
			
			</fieldset>
			
			<fieldset>
			
				<legend class="legenda">Informazioni corso</legend>
			
				<p>Corsi disponibili:
					
					<select name="corso">
					
						<option selected hidden>Scegli un corso</option>
						<option value="informatica">Informatica</option>
						<option value="cucina">Cucina</option>
						<option value="musica">Musica</option>
						<option value="arti">Arti Grafiche</option>
						<option value="fotografia">Fotografia</option>
					
					</select>
					
				 </p>
				 
				 <p>Sede nazionale:
					
					<select name="sede">
					
						<option selected hidden>Scegli la sede di iscrizione</option>
						<option value="MI">Milano</option>
						<option value="RO">Roma</option>
						<option value="BO">Bologna</option>
						<option value="TO">Torino</option>
						<option value="BA">Bari</option>
					
					</select>
					
				 </p>
				 
				 
			
			</fieldset>
				
			<fieldset>
			
				<legend class="legenda">Requisiti sconto</legend>
				
				<p>Situazione patrimoniale:
				 
				 	<input type="file" name="reddito" />
				 
				 </p>
			
			</fieldset>
				 
			<div id="invio">
			
				<div id="sx"><input class="sub" type="submit" value="Invia" /></div>
				<div id="dx"><input class="reset" type="reset" value="Ripristina!" /></div>
				
			
			</div>
				 
		
		</form>

			Fax: 020836402<br/>
			Telefono: <a href="tel:+39020836401">020836401</a>
			
		
		</footer>
	
	</div>

</body>

</html>
